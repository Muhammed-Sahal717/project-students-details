{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Student Details</title>

    <link rel="stylesheet" href="{% static 'students/style.css' %}" />
  </head>

  <body>
    <header>
      <h1>Student Details</h1>
      <p>Student information management system</p>
    </header>

    <main class="container">
      <h2>All Students</h2>

      <div class="student-grid">
        {% for student in students %}

        <div class="student">
          {% if student.image %}
          <img
            src="{{ student.image.url }}"
            alt="{{ student.name }}"
            class="student-image"
          />
          {% endif %}

          <h3>{{ student.name }}</h3>

          <p>
            <strong>Roll Number:</strong>
            {{ student.roll_number }}
          </p>

          <a href="{% url 'student_detail' student.id %}" class="view-button">
            View Details
          </a>
        </div>

        {% empty %}

        <p>No students found.</p>

        {% endfor %}
      </div>
    </main>
  </body>
</html>
